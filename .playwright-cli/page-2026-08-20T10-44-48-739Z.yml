              - listitem [ref=f1e656]: پس از گذشت ۲ ساعت از زمان صفر شدن موجودی حساب، شبکه ابرک‌های شما بر اساس سطح حساب کاربری‌تان قطع می‌شود و به ابرک دسترسی نخواهید داشت.
              - listitem [ref=f1e657]: پس از گذشت ۴۸ ساعت از زمان صفر شدن موجودی حساب، ابرک‌های شما خاموش می‌شوند، اما هزینه‌ی فضای ذخیره‌سازی هم‌چنان محاسبه و از اعتبار شما کم می‌شود
              - listitem [ref=f1e658]: پس از گذشت ۱ هفته از زمان صفر شدن موجودی حساب، ابرک‌ها، اسنپ‌شات‌ها، بکاپ‌ها، دیسک‌ها، IPها و سایر منابع سرور ابری پاک می‌شوند و امکان بازگرداندن اطلاعات آن‌ها به هیچ‌وجه وجود نخواهد داشت
